name: CI

on:
  push:
    branches:
      - main
      - abrham
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -s requirements.txt ]; then
            pip install -r requirements.txt
          fi
          pip install pytest

      - name: Check Python syntax
        run: python -m compileall -q modules tests

      - name: Run tests
        run: |
          set +e
          pytest -v
          status=$?
          set -e
          if [ "$status" -eq 5 ]; then
            echo "No tests are currently defined; syntax check passed."
            exit 0
          fi
          exit "$status"
