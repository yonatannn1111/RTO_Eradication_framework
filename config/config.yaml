# RTO Eradication Framework — orchestrator configuration
plc:
  ip: "127.0.0.1"
  modbus_port: 502
  s7_port: 1102
  https_port: 8443

snapshot:
  db1_size: 100
  db2_size: 100
  merker_size: 100

output_dir: "output"

# ... rest unchanged
plc:
  ip: "127.0.0.1"
  modbus_port: 502
  s7_port: 102
  https_port: 8443
  rack: 0
  slot: 1

snapshot:
  db1_size: 100
  db2_size: 100
  merker_size: 100
  output_dir: "snapshots"

attack:
  interval_seconds: 10
  rounds: 1
  scenarios:
    - name: timer
      target_register: 1
      new_value: 12000
    - name: counter
      target_register: 3
      new_value: 65535
    - name: flag
      target_register: 0
      new_value: 0

detection:
  tolerance: 0
  alert_on_change: true

logging:
  level: INFO
  file: "logs/orchestrator.log"
  scheduler_url: "http://127.0.0.1:5002"

  cost_inputs:
  queue_length: 8
  flights_affected: 2
  belt_criticality: high
  wait_minutes: 0

  belt_id: "plc_a"
safety_url: "http://127.0.0.1:5003"
trusted_snapshot: "snapshots/trusted_baseline.json"