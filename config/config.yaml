# RTO Eradication Framework — orchestrator configuration

plc:
  ip: "127.0.0.1"
  modbus_port: 502
  s7_port: 102
  https_port: 8443
  rack: 0
  slot: 1

snapshot:
  db1_size: 100
  db2_size: 100
  merker_size: 100
  output_dir: "snapshots"

attack:
  interval_seconds: 10
  rounds: 1
  scenarios:
    - name: timer
      target_register: 1
      new_value: 12000
    - name: counter
      target_register: 3
      new_value: 65535
    - name: flag
      target_register: 0
      new_value: 0

detection:
  tolerance: 0
  alert_on_change: true

logging:
  level: INFO
  file: "logs/orchestrator.log"